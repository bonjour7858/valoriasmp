name: Synchroniser le code admin

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-admin-code:
    runs-on: ubuntu-latest
    steps:
      - name: Envoyer le code admin à Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
        run: |
          AUTH=()
          case "$SUPABASE_SERVICE_KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $SUPABASE_SERVICE_KEY");; esac
          jq -n --arg c "$ADMIN_CODE" '{new_code:$c}' | curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/rest/v1/rpc/set_admin_code" \
            -H "apikey: $SUPABASE_SERVICE_KEY" "${AUTH[@]}" \
            -H "Content-Type: application/json" --data @-
