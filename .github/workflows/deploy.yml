name: Déploiement ValoriaSMP

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Synchroniser le code admin vers Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          ADMIN_CODE: ${{ secrets.ADMIN_CODE }}
        run: |
          AUTH=()
          case "$SUPABASE_SERVICE_KEY" in eyJ*) AUTH=(-H "Authorization: Bearer $SUPABASE_SERVICE_KEY");; esac
          jq -n --arg c "$ADMIN_CODE" '{new_code:$c}' | curl -sS --fail-with-body -X POST \
            "$SUPABASE_URL/rest/v1/rpc/set_admin_code" \
            -H "apikey: $SUPABASE_SERVICE_KEY" "${AUTH[@]}" \
            -H "Content-Type: application/json" --data @-

      - name: Préparer le site
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir _site
          cp -r index.html assets data _site/
          jq -nr --arg u "$SUPABASE_URL" --arg k "$SUPABASE_ANON_KEY" \
            '"window.VALORIA_CONFIG = " + ({url:$u,key:$k}|tojson) + ";"' > _site/assets/config.js

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
